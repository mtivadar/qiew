[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qiew"
version = "2.0.0"
description = "Hex / binary / disassembly viewer for reverse engineering (PE, ELF, MBR, NTFS, APK)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Marius TIVADAR" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.23",
    "capstone>=5.0",
    "pefile>=2023.2.7",
    "pyelftools>=0.29",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
aes = ["pyaes>=1.6"]
apk = ["androguard>=3.3"]
all = ["pyaes>=1.6", "androguard>=3.3"]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
qiew = "qiew.app:main"

[project.gui-scripts]
qiew-gui = "qiew.app:main"

[tool.setuptools.packages.find]
include = ["qiew*"]

[tool.setuptools.package-data]
qiew = ["resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
